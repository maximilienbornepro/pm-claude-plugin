# Arborescence standard d'une mission + miroir Notion <-> Drive/SharePoint.
# Sert de reference au generateur `scaffold` : creer-si-absent uniquement, jamais recreer/ecraser,
# jamais de doublon (on matche par la correspondance ci-dessous, PAS par nom a l'identique).

# --- REGLE DU MIROIR (Notion <-> SharePoint) --------------------------------
# Pour chaque zone : une page Notion sous notion.project_management_root, dont le corps porte
#   1) un LIEN vers le dossier SharePoint correspondant (lien navigateur AllItems.aspx, jamais
#      un lien de telechargement) ;
#   2) une DESCRIPTION courte et factuelle de son contenu (conventions skill sinbad-notion).
# Le scaffold ne cree une page que si elle manque ; si elle existe, il peut proposer d'ajouter
# le lien/description manquants, jamais de remplacer l'existant. Aucune action qui notifie.

# Niveau racine du Drive de mission
root:
  - "00 - Conception"
  - "01 - Cadrage"
  - "02 - Project Management"

# Zones de "02 - Project Management" : dossier Drive <-> titre de page Notion.
# `notion: "à confirmer"` = pas de page evidente -> le scaffold la proposerait (dry-run d'abord).
#
# `office:` = FICHIER(S) STANDARD attendu(s) dans le dossier (pas de dossier vide). Noms derives de
# SINBAD, avec le jeton <MISSION> remplace par le nom de la mission. Le scaffold les SIGNALE comme
# manquants et PROPOSE de les creer (par copie de modele, ecriture gardee) ; il n'ecrase jamais.
# Un dossier sans `office` n'a pas (encore) de fichier type - ex. Quality Management : rien pour le moment.
project_management:
  - { drive: "01 - Cadrage",            notion: "Cadrage" }
  - { drive: "02 - Gouvernance",        notion: "Gouvernance",        office: ["RACI_<MISSION>.xlsx"] }
  - { drive: "03 - Roadmap",            notion: "Roadmap",            office: ["Roadmap_<MISSION>.xlsx"] }
  # Planning : la REFERENCE est la page Notion avec le GANTT (notion_db "planning"), PAS un Excel.
  # Le dossier Drive "04 - Planning" n'est pas forcement utilise -> aucun fichier office attendu.
  - { drive: "04 - Planning",           notion: "Planning",           notion_db: "planning" }
  - { drive: "05 - Perimetre",          notion: "Scope",              office: ["Scope_<MISSION>.xlsx"] }
  - { drive: "06 - Risques",            notion: "Risques",            office: ["Risks_<MISSION>.xlsx"] }
  - { drive: "07 - Architecture (DAT)", notion: "Architecture (DAT)" }
  - { drive: "08 - GATE",               notion: "GATE",               office: ["GATE1_<MISSION>.pptx"] }
  - { drive: "09 - Contacts",           notion: "Contacts",           office: ["Contacts_<MISSION>.xlsx"] }

# Pages Notion SANS dossier Drive. Le scaffold les cree sous Project Management (jamais a la racine).
notion_only:
  - { notion: "Hebdo",                  notion_db: "sujets" }   # porte la DB "Suivi des sujets"

# Bases Notion portees par une page (notion_db). Le scaffold cree la page + la DB (bonnes proprietes +
# la bonne vue) et y insere les EXEMPLES du sample. `rows_from` = la liste du sample a transformer en lignes.
databases:
  planning:
    title: "Planning de build"
    view: timeline            # Gantt (barres Debut->Fin)
    sample: "framework/generators/notion-planning/planning.sample.yml"
    rows_from: workstreams
    properties: ["Workstream:title", "Pole:text", "Debut:date", "Fin:date", "Statut:select", "Avancement:number"]
  sujets:
    title: "Suivi des sujets"
    view: table
    sample: "framework/generators/notion-topics-audit/sujets.sample.yml"
    rows_from: sujets
    properties: ["Sujet:title", "Statut:select", "Priorite:select", "Responsable:text", "Suivi projet:select", "Action attendue:text"]
