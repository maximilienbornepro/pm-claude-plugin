# Exemple complet de porte : un bloquant (C5 à 0) levé par un WAIVER à 8 champs, et un acte humain.
gate:
  name: "Ready-to-Dev"
  scale: [0, 0.5, 1]
  threshold: 90
  criteria:
    - { id: C1, label: "Besoins tracés aux sources", score: 1 }
    - { id: C2, label: "Exigences testables (ISO 29148)", score: 1 }
    - { id: C3, label: "Parcours métier couverts", score: 1 }
    - { id: C4, label: "Backlog chiffré et priorisé", score: 1 }
    - { id: C5, label: "Stratégie de test + cas tracés", score: 0 }     # bloquant
    - { id: C6, label: "Contrats d'API (BFF) validés", score: 1 }
    - { id: C7, label: "Environnement de dev disponible", score: 1 }
    - { id: C8, label: "Sécurité : avis obtenu", score: 1 }
    - { id: C9, label: "Pilotage à jour (RACI, risques)", score: 1 }
    - { id: C10, label: "Gouvernance : gate franchie en amont", score: 1 }
  # Le seuil (90 %) n'est atteint QUE si le bloquant C5 est levé ET les autres tiennent le compte.
  acte_humain:
    approbateur: "CP/RSIA"
    date: "2026-10-18"
    motif: "revue de porte en COPIL, écart C5 assumé avec remédiation datée"
  waivers:
    - bloquant: C5
      approbateur: "Sponsor"
      date: "2026-10-18"
      motif: "recette pilotée en parallèle du dev, démarrage anticipé assumé"
      echeance: "2026-11-30"
      surveillance: "revue hebdo en COPROJ"
      remediation: "AMOA"
      cible: "stratégie de test validée et premier lot de cas tracés aux exigences"
