<script>
(function(){
  var names={partenaires:"Les acquisitions",redirection:"Applications partenaires",apipartenaires:"API partenaires",traitement:"Traitement - AIFA",aifa:"Chaîne AIFA",donnees:"Bucket S3",apirest:"Exposition BFF",frontend:"Frontend",identite:"Identité (OIDC)",exploitation:"Cluster EKS - déploiement & supervision",services:"Services applicatifs"};
  var trail=document.getElementById("trail");
  var cur="overview",hist=[];
  function render(id){
    document.querySelectorAll(".view").forEach(function(v){v.hidden=(v.id!=="v-"+id);});
    if(id==="overview"){trail.innerHTML="";}
    else{trail.innerHTML='<span class="sep">›</span> <span class="cur">'+(names[id]||id)+'</span>';}
    cur=id;
    try{document.querySelector(".stage").scrollIntoView({block:"nearest"});}catch(e){}
  }
  function go(id){ if(id!==cur){hist.push(cur);} render(id); }
  function back(){ render(hist.length?hist.pop():"overview"); }
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){go(b.getAttribute("data-go"));});
    b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go(b.getAttribute("data-go"));}});
  });
  document.querySelectorAll("[data-back]").forEach(function(b){b.addEventListener("click",function(){back();});});
  document.getElementById("home").addEventListener("click",function(){hist=[];render("overview");});
  try{var L=window.LOGOS||{};document.querySelectorAll('image[data-logo]').forEach(function(im){var k=im.getAttribute('data-logo');if(L[k]){im.setAttributeNS('http://www.w3.org/1999/xlink','href',L[k]);im.setAttribute('href',L[k]);}});}catch(e){}
  go("overview");
})();
</script>
