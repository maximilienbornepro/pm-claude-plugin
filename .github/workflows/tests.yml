name: tests

# Every push and every pull request: verifier + all harness suites, including every deliverable
# generated for real on the test mission (framework/harness/fixtures). No secret, no connector.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r framework/harness/requirements.txt
      - run: python3 framework/pm.py test
